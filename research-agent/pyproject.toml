[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research-agent"
version = "1.0.0"
description = "Extensible LangChain research agent with OpenAI reasoning and PostgreSQL persistence"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "langchain-core>=1.1,<2",
  "langchain-openai>=1.1,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "python-dotenv>=1.0,<2",
]

[tool.setuptools.package-data]
research_agent = ["migrations/*.sql"]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[project.scripts]
research-agent = "research_agent.cli:main"
research-agent-migrate = "research_agent.migrate:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["research_agent"]
